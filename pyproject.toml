[project]
name = "ord-app"
version = "0.1.0"
description = "FastAPI app for the viewing and editing the [Open Reaction Database](github.com/Open-Reaction-Database)"
authors = [
    {name = "hobs", email = "github@totalgood.com"},
    {name = "Steven Kearnes", email = "github.com/skearns"},
    ]
readme = "README.md"
# url = 'https://github.com/Open-Reaction-Database/ord-schema'"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
	"orjson>=3.10.12",
    "loguru>=0.7.3",
    "freezegun>=1.5.1",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.8",
    "gunicorn>=23.0.0",
    "ord-schema>=0.3.96",
    "protobuf>=4.22",
    "rdkit>=2024.9.5",
    "uvicorn>=0.34.0",
    "python-multipart>=0.0.20",
    "alembic>=1.14.1",
    "sqlalchemy>=2.0.38",
    "pydantic-settings>=2.7.1",
    "fastapi-pagination>=0.12.34",
	"pydantic[email]>=2.10.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "faker>=36.1.1",
    "sqlalchemy-utils>=0.41.2",
    "coverage>=7.6.12",
    "httpx>=0.28.1",
    "pytest-cov>=6.0.0",
    "pytype>=2024.10.11",
    "pytest-asyncio>=0.25.3",
    "psycopg>=3.2.5",
    "ruff>=0.9.9"
]

# from ord-schema
# docs = [
#     "Pygments>=2.13.0",
#     "Sphinx>=5.3.0",
#     "ipython>=8.4.0",
#     "sphinx-rtd-theme>=1.1.1",
#     "sphinx-tabs>=3.4.0",
# ]
# examples = [
#     "glob2>=0.7",
#     "matplotlib>=3.3.4",
#     "scikit-learn>=0.24.1",
#     "tensorflow>=2.4.1",
#     "wget>=3.2",
# ]
tests = [
    "black[jupyter]>=22.3.0",
    "coverage>=5.2.1",
    "pylint>=2.17.4",
    "pytest>=7.1.1",
    "pytest-cov>=3.0.0",
    "pytest-xdist>=3.0.2",
    "pytype>=2023.6.16",
    "testing-postgresql>=1.3.0",
    "treon>=0.1.3",
]

[tool.black]
line-length = 120

[tool.isort]
skip_glob = ["**/*_pb2.py*"]
line_length = 120
profile = "black"
known_third_party = ["ord_schema"]

[tool.pytype]
inputs = ["ord_app"]
exclude = ["**/*_test.py", "**/test_*.py", "build/", "dist/"]
keep_going = true
disable = ["module-attr", "pyi-error"]
jobs = 0

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"
